<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация — Интернет-магазин</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-wrap">
    <form id="register-form" class="login-card">
      <h1>Регистрация покупателя</h1>
      <label>
        Логин
        <input type="text" id="username" name="username" required minlength="3" maxlength="50">
      </label>
      <label>
        Пароль
        <input type="password" id="password" name="password" required minlength="6" maxlength="200">
      </label>
      <button type="submit">Зарегистрироваться</button>
      <p id="error-msg" class="error"></p>
      <p><a href="/login.html">Уже есть аккаунт? Войти</a></p>
    </form>
  </div>
  <script src="/js/register.js"></script>
</body>
</html>
